# Hearthdeck off-site backup jobs.
#
# Sourced by /usr/lib/hearthdeck/hearthdeck-backup. One job per line:
#
#   "name|source|destination|mode|filter-file|extra rclone flags"
#
# mode:
#   copy  upload new/changed files, never delete anything on the remote
#   sync  make the remote match the source (only for rotating dumps/snapshots)
#
# filter-file is a name under filters/ or "-" for no filter.
# destination is any rclone remote path, so moving a source to another cloud is
# just a one-line change.
#
# $HEARTHDECK_BACKUP_REMOTE and $HEARTHDECK_BACKUP_ROOT come from
# ~/.config/hearthdeck-backup/backup.env, which Settings writes. Editing this
# file is optional: the packaged copy is used when no user copy exists.
#
# For the future AWS Glacier job, create an S3/Glacier remote (for example
# "aws-glacier") and add:
#
#   "immich-photos|/mnt/immich/data/upload|aws-glacier:$HEARTHDECK_BACKUP_ROOT/photos|copy|photos.rclone|--s3-storage-class=DEEP_ARCHIVE"
#
# Keep photos out of the nightly pCloud run until the AWS remote is ready.

JOBS=(
  "immich-db|$MOUNT_ROOT/immich/backups|$HEARTHDECK_BACKUP_REMOTE:$HEARTHDECK_BACKUP_ROOT/immich|sync|sqlgz.rclone|"
  "romm-db|$MOUNT_ROOT/romM/backups|$HEARTHDECK_BACKUP_REMOTE:$HEARTHDECK_BACKUP_ROOT/romm|sync|sqlgz.rclone|"

  "retro-saves|$HOME/.local/share/hearthdeck/retroarch/saves|$HEARTHDECK_BACKUP_REMOTE:$HEARTHDECK_BACKUP_ROOT/retroarch/saves|copy|retro-saves.rclone|"
  "retro-states|$HOME/.local/share/hearthdeck/retroarch/states|$HEARTHDECK_BACKUP_REMOTE:$HEARTHDECK_BACKUP_ROOT/retroarch/states|copy|states.rclone|"
  "ps2-memcards|$HOME/.local/share/hearthdeck/retroarch/system/pcsx2/memcards|$HEARTHDECK_BACKUP_REMOTE:$HEARTHDECK_BACKUP_ROOT/retroarch/ps2-memcards|copy|memcards.rclone|"
  "dreamcast-vmu|$HOME/.local/share/hearthdeck/retroarch/system/dc|$HEARTHDECK_BACKUP_REMOTE:$HEARTHDECK_BACKUP_ROOT/retroarch/dreamcast-vmu|copy|vmu.rclone|"

  "hearthdeck-db|$STATE_DIR/db|$HEARTHDECK_BACKUP_REMOTE:$HEARTHDECK_BACKUP_ROOT/hearthdeck/db|sync|sqlite.rclone|"
  "hearthdeck-config|$HOME/.config/hearthdeck|$HEARTHDECK_BACKUP_REMOTE:$HEARTHDECK_BACKUP_ROOT/hearthdeck/config|copy|-|"
  "retroarch-config|$HOME/.config/retroarch/config|$HEARTHDECK_BACKUP_REMOTE:$HEARTHDECK_BACKUP_ROOT/hearthdeck/retroarch-config|copy|-|"
  "hearthdeck-meta|$HOME/.local/share/hearthdeck|$HEARTHDECK_BACKUP_REMOTE:$HEARTHDECK_BACKUP_ROOT/hearthdeck/meta|copy|hearthdeck-meta.rclone|"
)
