[tools]
rust = "1.97.1"
just = "latest"
# `scripts/dev` parses the daemon's pairing JSON with `jq`. It is a system package on
# this host and a pacman dependency in CI, so it is deliberately not pinned through mise.
# Optional compile cache. Installed, but deliberately NOT enabled: enabling it means
# RUSTC_WRAPPER=sccache, which changes cargo's fingerprints and forces one full rebuild.
# See CONTRIBUTING.md -> "Faster rebuilds with sccache" for the one-line opt-in.
sccache = "latest"
