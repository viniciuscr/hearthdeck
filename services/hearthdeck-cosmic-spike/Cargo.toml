[workspace]

[package]
name = "hearthdeck-cosmic-spike"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = """
Disposable COSMIC UI spike to compare against the Flutter launcher UI.
Starts with one dashboard entry and navigates to the first full-library screen.
"""

[target.'cfg(target_os = "linux")'.dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic/", features = [
  "wayland",
  "winit",
  "wgpu",
  "tokio",
] }
tokio = { version = "1", features = ["rt-multi-thread"] }
