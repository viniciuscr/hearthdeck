[package]
name = "hearthdeck-overlay"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = """
Quick-menu overlay for the Hearthdeck session (see
packaging/arch/hearthdeck-session): a full-screen, semi-transparent
wlr-layer-shell surface built with libcosmic, toggled by a gamepad's
Guide/Mode button (evdev BTN_MODE). cosmic-comp is a real multi-surface
Wayland compositor (the same mechanism cosmic-panel/cosmic-launcher
themselves use), so the overlay is architecturally sound there. UNTESTED
against a real Linux/Wayland toolchain - first build must happen on real
hardware.

PKGBUILD builds and installs it for the Hearthdeck session.
"""

[target.'cfg(target_os = "linux")'.dependencies]
cosmic-config = { git = "https://github.com/pop-os/libcosmic" }  # bare URL, no rev: see the note on libcosmic below
cosmic-settings-config = { git = "https://github.com/pop-os/cosmic-settings-daemon", package = "cosmic-settings-config" }  # bare URL: must match the source libcosmic itself requires
evdev = { version = "0.13", features = ["tokio"] }
futures-channel = "0.3"
futures-util = "0.3"
hearthdeck-protocol = { path = "../hearthdeck-protocol" }
# Bare URL, deliberately: cargo treats "git+URL" and "git+URL?rev=..." as different
# sources, and cosmic-app-list-config requires this same bare URL. Any rev here
# would compile the whole libcosmic workspace twice. Cargo.lock pins the commit.
libcosmic = { git = "https://github.com/pop-os/libcosmic", features = [
  "wayland",
  "winit",
  "wgpu",
  "tokio",
] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xkbcommon = "0.9"
