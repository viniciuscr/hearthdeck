[package]
name = "hearthdeck-overlay"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = """
Quick-menu overlay for the "COSMIC (Test)" session (see
packaging/arch/cosmic-test-session): a full-screen, semi-transparent
wlr-layer-shell surface built with libcosmic, toggled by a gamepad's
Guide/Mode button (evdev BTN_MODE). Not used by, and has no effect on, the
Hearthdeck Kiosk (Gamescope) session - see docs/kiosk-session.md's "Do not"
list for why a second compositor client is unsafe there specifically;
cosmic-comp is a different, real multi-surface Wayland compositor (the same
mechanism cosmic-panel/cosmic-launcher themselves use) where this is
architecturally sound. UNTESTED against a real Linux/Wayland toolchain -
first build must happen on real hardware.
"""

[dependencies]
evdev = { version = "0.13", features = ["tokio"] }
futures-channel = "0.3"
futures-util.workspace = true
libcosmic = { git = "https://github.com/pop-os/libcosmic/", features = [
  "wayland",
  "winit",
  "tokio",
] }
nix = { version = "0.29", features = ["signal"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber.workspace = true
