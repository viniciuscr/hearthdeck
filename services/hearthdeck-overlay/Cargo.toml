[workspace]

[package]
name = "hearthdeck-overlay"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = """
Quick-menu overlay for the "COSMIC (Test)" session (see
packaging/arch/cosmic-test-session): a full-screen, semi-transparent
wlr-layer-shell surface built with libcosmic, toggled by a gamepad's
Guide/Mode button (evdev BTN_MODE). Not used by, and has no effect on, the
Hearthdeck Kiosk (Gamescope) session - see docs/kiosk-session.md's "Do not"
list for why a second compositor client is unsafe there specifically;
cosmic-comp is a different, real multi-surface Wayland compositor (the same
mechanism cosmic-panel/cosmic-launcher themselves use) where this is
architecturally sound. UNTESTED against a real Linux/Wayland toolchain -
first build must happen on real hardware.

Deliberately NOT a member of services/Cargo.toml's workspace: libcosmic
pulls in iced/wgpu/winit/smithay-client-toolkit, a dependency tree large
enough that `cargo build --workspace` (what `just ci-check` runs) went from
~3 minutes to ~25 building it every time. Build/test this crate on its own:
  cargo build --manifest-path services/hearthdeck-overlay/Cargo.toml --release
PKGBUILD builds and installs it only for the COSMIC (Test) session.
"""

[target.'cfg(target_os = "linux")'.dependencies]
cosmic-config = { git = "https://github.com/pop-os/libcosmic/" }
cosmic-settings-config = { git = "https://github.com/pop-os/cosmic-settings-daemon/", package = "cosmic-settings-config" }
evdev = { version = "0.13", features = ["tokio"] }
futures-channel = "0.3"
futures-util = "0.3"
libcosmic = { git = "https://github.com/pop-os/libcosmic/", features = [
  "wayland",
  "winit",
  "wgpu",
  "tokio",
] }
nix = { version = "0.29", features = ["signal"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xkbcommon = "0.9"
