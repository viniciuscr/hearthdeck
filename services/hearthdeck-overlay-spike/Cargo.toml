[package]
name = "hearthdeck-overlay-spike"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = """
Disposable spike, temporarily installed by packaging/arch/PKGBUILD as
/usr/bin/hearthdeck-overlay-spike so it can be run on kiosk hardware with
just `sudo pacman -Syu`, not a real feature. Confirms on real kiosk hardware
whether GAMESCOPE_EXTERNAL_OVERLAY behaves as Gamescope's own source implies
(composited on top without resizing/focus-stealing), and whether that same
window supports real per-pixel alpha transparency (needed for a side-menu
overlay: an opaque/semi-opaque panel plus a fully transparent region showing
the content underneath) - before any real overlay work is built on top of
either assumption. Delete this crate, its workspace membership, its PKGBUILD
install line, and its docs/arch-package.md bullet once both findings are
confirmed either way. See docs/kiosk-session.md.
"""

[dependencies]
x11rb = { version = "0.13", features = ["render"] }
