[package]
name = "hearthdeck-applet-user"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = """
COSMIC panel applet for the "COSMIC (Test)" session: displays the logged-in
username in the top bar as a static text label. Applet ID:
io.github.viniciuscr.hearthdeck.AppletUser. Wired into the panel's
plugins_wings config key (see packaging/arch/cosmic-test-session's
apply_cosmic_overrides) - but that alone does nothing without the matching
packaging/arch/hearthdeck-applet-user.desktop: cosmic-panel discovers and
spawns applets by .desktop filename, not by running a same-named binary
directly, and cosmic-settings' applet picker only lists ones with
X-CosmicApplet=true in that file. See docs/cosmic-panel-customization.md.

"""

[target.'cfg(target_os = "linux")'.dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic/", features = [
  "applet",
  "wayland",
  "winit",
  "wgpu",
  "tokio",
] }
tokio = { version = "1", features = ["rt-multi-thread"] }
