[workspace]

[package]
name = "hearthdeck-applet-user"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = """
COSMIC panel applet for the "COSMIC (Test)" session: displays the logged-in
username in the top bar as a static text label. Registered with cosmic-panel
via the plugins_wings config key (see packaging/arch/cosmic-test-session's
apply_cosmic_overrides). Applet ID: io.github.viniciuscr.hearthdeck.AppletUser.

Deliberately NOT a member of services/Cargo.toml's workspace for the same
reason hearthdeck-overlay isn't: libcosmic's dependency tree would add ~20
minutes to `cargo build --workspace`. Build on its own:
  cargo build --manifest-path services/hearthdeck-applet-user/Cargo.toml --release
"""

[target.'cfg(target_os = "linux")'.dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic/", features = [
  "applet",
  "wayland",
  "winit",
  "wgpu",
  "tokio",
] }
tokio = { version = "1", features = ["rt-multi-thread"] }
