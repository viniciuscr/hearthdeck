[package]
name = "hearthdeck-frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "COSMIC desktop frontend for HearthDeck - Xbox-style game and application launcher"

[features]
default = ["wgpu"]
wgpu = ["libcosmic/wgpu"]

[dependencies]
# COSMIC framework
libcosmic = { git = "https://github.com/pop-os/libcosmic", features = [
    "dbus-config",
    "desktop",
    "winit",
    "wayland",
    "tokio",
    "single-instance",
    "desktop-systemd-scope",
    "xdg-portal",
] }
sctk = { package = "smithay-client-toolkit", version = "0.20.0" }

# Async runtime
tokio.workspace = true
futures = "0.3.31"

# Serialization
serde.workspace = true
serde_json.workspace = true
ron = "0.12"

# Logging
pretty_env_logger = "0.5"
log = "0.4"
tracing.workspace = true
chrono.workspace = true

# i18n
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
rust-embed = "8.9"

# CLI
clap = { version = "4.5", features = ["derive"] }

# System integration
gilrs = "0.11.2"
nix = { version = "0.30", features = ["fs"] }
cosmic-app-list-config = { git = "https://github.com/pop-os/cosmic-applets" }

# HTTP client for daemon communication
ureq = "3"
reqwest.workspace = true

# Utilities
anyhow.workspace = true
async-trait.workspace = true
itertools = "0.14"
url = "2.5"
urlencoding = "2.1"
resvg = "0.45.1"
thiserror.workspace = true

# Workspace dependencies
hearthdeck-protocol = { path = "../hearthdeck-protocol" }

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd"] }
nmrs = "3.4.0"
