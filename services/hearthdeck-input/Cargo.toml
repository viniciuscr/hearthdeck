[package]
name = "hearthdeck-input"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
hearthdeck-protocol = { path = "../hearthdeck-protocol" }
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
evdev = { version = "0.13", features = ["tokio"] }
hearthdeck-observability = { path = "../hearthdeck-observability" }
tokio.workspace = true
tracing.workspace = true
cosmic-client-toolkit = { git = "https://github.com/pop-os/cosmic-protocols", rev = "32283d7" }
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols", rev = "32283d7", features = ["client"] }
sctk = { package = "smithay-client-toolkit", version = "0.20.0" }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
