[workspace]
members = [
  "hearthdeck-protocol",
  "hearthdeck-observability",
  "hearthdeck-daemon",
  "hearthdeck-bridge",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["json", "ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
directories = "6.0.0"
futures-util = "0.3.31"
rand = "0.10.0"
roxmltree = "0.21.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "sqlite-bundled"] }
thiserror = "2.0.17"
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread", "net", "process", "signal", "sync", "time", "io-util", "fs"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["cors", "limit", "request-id", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
uuid = { version = "1.21.0", features = ["v4", "serde"] }
