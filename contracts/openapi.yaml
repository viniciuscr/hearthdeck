openapi: 3.1.1
info:
  title: Hearthdeck Local API
  version: 0.1.0
  description: |
    Local-first API for Hearthdeck clients. The daemon exposes this API to paired
    clients. It never exposes arbitrary shell-command execution.
servers:
  - url: https://{host}:38400
    variables:
      host:
        default: hearthdeck.local
paths:
  /v1/health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Daemon status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/diagnostics:
    get:
      operationId: getDiagnostics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Bounded Hearthdeck service diagnostics and recent events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagnostics'
  /v1/pairing/complete:
    post:
      operationId: completePairing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingRequest'
      responses:
        '200':
          description: Paired client credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairedClient'
  /v1/library:
    get:
      operationId: listLibrary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Library items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LibraryItem'
  /v1/activity/recent:
    get:
      operationId: listRecentActivity
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 6 }
      responses:
        '200':
          description: Most recently launched items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecentActivity'
  /v1/collections:
    get:
      operationId: listCollections
      security:
        - bearerAuth: []
      description: >-
        The dashboard's collections in composition order. A membership
        collection lists its stored items; a rule collection has its items
        derived by the daemon on every read. `stremio:new-arrivals` is the one
        collection a client draws as a hero banner rather than as a rail — its
        items carry the wide art a banner draws with.
      responses:
        '200':
          description: The dashboard's collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Collection'
  /v1/collections/{slug}/items:
    post:
      operationId: addCollectionItem
      security:
        - bearerAuth: []
      description: >-
        Adds an item to a curated collection, or refreshes the display name and
        icon of one already there without moving it. Answers `404` for an
        unknown collection and `400` for one whose contents are derived.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_id, name]
              properties:
                item_id: { type: string }
                name: { type: string }
                icon: { type: [string, 'null'] }
      responses:
        '200':
          description: The collection as it now stands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
    delete:
      operationId: removeCollectionItem
      security:
        - bearerAuth: []
      description: >-
        Removes an item from a curated collection. Removing one that is not there
        is not an error: the caller asked for it to be gone.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_id]
              properties:
                item_id: { type: string }
      responses:
        '200':
          description: The collection as it now stands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
  /v1/library/rescan:
    post:
      operationId: rescanLibrary
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Discovery jobs accepted
  /v1/categorization:
    get:
      operationId: getCategorization
      security:
        - bearerAuth: []
      description: >-
        The state of the categorization scan and the most recent report it
        produced, which the client turns into the library's category tabs. A
        `null` report means the library has never been scanned. `enabled` is the
        user's opt-in, the only switch there is: while it is false nothing is
        downloaded, nothing is scanned, and a client must leave the ordinary tabs
        alone. `POST /v1/categorization/enable` is the whole of the setup — it
        fetches the checkpoint, with no deployment configuration involved.
        Nothing is classified until a client asks for it.
      responses:
        '200':
          description: The scan status and the latest report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorizationResponse'
  /v1/categorization/enable:
    post:
      operationId: enableCategorization
      security:
        - bearerAuth: []
      description: >-
        Turns smart categorization on and fetches the checkpoint when none is
        cached. It classifies nothing: scans and form-factor detection each
        have their own endpoint. Answers as soon as the download is accepted;
        progress is on `GET /v1/categorization`.
      responses:
        '202':
          description: Enabled, and the download accepted
  /v1/categorization/disable:
    post:
      operationId: disableCategorization
      security:
        - bearerAuth: []
      description: >-
        Turns it off: removes the rails and verdicts the feature produced. The
        downloaded checkpoint is kept. A job already running is left to finish,
        and what it decides is thrown away.
      responses:
        '204':
          description: Disabled
  /v1/categorization/scan:
    post:
      operationId: startCategorizationScan
      security:
        - bearerAuth: []
      description: >-
        Files the library by rules (no model) and publishes the dashboard rails
        the result implies (Watch, ...). Answers as soon as it is accepted; the
        result arrives on the event stream (`categorization_changed`) and in the
        next `GET`. Requesting it while a job runs coalesces rather than failing.
      responses:
        '202':
          description: Scan accepted
        '409':
          description: Categorization is not enabled
  /v1/categorization/form-factors:
    post:
      operationId: detectFormFactors
      security:
        - bearerAuth: []
      description: >-
        Asks the model which applications are couch-friendly, for every
        application without a current verdict. Answers as soon as the job is
        accepted; the verdicts arrive as a library change.
      responses:
        '202':
          description: Detection accepted
        '409':
          description: >-
            Categorization is not enabled, another job is running, or the model
            is not downloaded yet
  /v1/categorization/collections:
    delete:
      operationId: removeCategorizationCollections
      security:
        - bearerAuth: []
      description: >-
        Removes the dashboard rails the model published. Other collections are
        left alone. Works whether or not categorization is enabled.
      responses:
        '204':
          description: Rails removed
  /v1/retro/consoles:
    get:
      operationId: listRetroConsoles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Consoles available from the configured local RomM instance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RetroConsole'
        '503':
          description: RomM is not configured
  /v1/retro/roms:
    get:
      operationId: listRetroRoms
      security:
        - bearerAuth: []
      parameters:
        - name: platform_id
          in: query
          required: false
          description: Restrict results to one console. Omit to search across all consoles.
          schema: { type: integer, minimum: 1 }
        - name: q
          in: query
          required: false
          description: Free-text search term, forwarded to RomM's own search.
          schema: { type: string, minLength: 1 }
        - name: genre
          in: query
          required: false
          description: >-
            Narrow to games carrying this genre, forwarded to RomM's own `genres`
            filter. The value is one of /v1/retro/facets' `genre` options, and the
            filter is applied by the source, so it covers the whole library rather
            than the pages already loaded.
          schema: { type: string, minLength: 1 }
        - name: region
          in: query
          required: false
          description: >-
            Narrow to games carrying this region, forwarded to RomM's own
            `regions` filter. The value is one of /v1/retro/facets' `region`
            options.
          schema: { type: string, minLength: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 48 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: A paginated live view of RomM games, optionally scoped to one console and/or a search term
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetroGamePage'
        '503':
          description: RomM is not configured
  /v1/retro/facets:
    get:
      operationId: listRetroFacets
      summary: The filter dimensions the console grid can narrow by
      security:
        - bearerAuth: []
      parameters:
        - name: platform_id
          in: query
          required: false
          description: >-
            Restrict the facets to one console. Omit to read the whole library's
            filter values.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: >-
            One entry per filterable dimension, each listing every value the
            source reports for the scope - not just the ones a loaded page
            happens to carry, so the grid can offer complete options before it
            pages anything. A dimension the source reported no values for is
            dropped rather than returned empty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RetroFacet'
        '502':
          description: RomM refused the query
        '503':
          description: RomM is not configured
  /v1/retro/roms/{id}:
    get:
      operationId: getRetroRomDetails
      description: >-
        Full metadata for one RomM game, for the console-game details screen.
        Deliberately not folded into listRetroRoms: that route returns 48 games
        at a time, so detail-only fields would be paid for on every tile in the
        grid rather than only for the game the user opened.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: RomM rom ID
          schema: { type: integer }
      responses:
        '200':
          description: The game's detail fields, as RomM reports them
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetroGameDetails'
        '503':
          description: RomM is not configured
  /v1/retro/roms/{id}/favorite:
    post:
      operationId: setRetroFavorite
      description: >-
        Adds or removes one game from the user's RomM favorites and answers with
        the state that holds. Favorites live in RomM (a collection RomM flags as
        the favorite list), not in Hearthdeck, so every RomM client sees the same
        list. Requires a RomM token with collections write scope.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: RomM rom ID
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [favorite]
              properties:
                favorite: { type: boolean }
      responses:
        '200':
          description: The favorite state that now holds
          content:
            application/json:
              schema:
                type: object
                required: [favorite]
                properties:
                  favorite: { type: boolean }
        '502':
          description: RomM rejected the change, or its token lacks write scope
        '503':
          description: RomM is not configured
  /v1/retro/roms/{id}/backlog:
    post:
      operationId: setRetroBacklogged
      description: >-
        Sets RomM's per-user "play later" flag for one game and answers with the
        state that holds. RomM's own backlog, so the same flag drives RomM's UI
        and its filters. Requires a RomM token with roms write scope.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: RomM rom ID
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [backlogged]
              properties:
                backlogged: { type: boolean }
      responses:
        '200':
          description: The play-later state that now holds
          content:
            application/json:
              schema:
                type: object
                required: [backlogged]
                properties:
                  backlogged: { type: boolean }
        '502':
          description: RomM rejected the change, or its token lacks write scope
        '503':
          description: RomM is not configured
  /v1/retro/service/restart:
    post:
      operationId: restartRommService
      description: >-
        Restarts the fixed romm.service systemd user unit (see
        deploy/systemd/romm.service), if the user has configured it.
        The unit name is not a request parameter.
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Restart requested
        '502':
          description: systemd rejected the restart, or the unit is not installed
  /v1/retro/assets:
    get:
      operationId: getRetroAsset
      security:
        - bearerAuth: []
      parameters:
        - name: path
          in: query
          required: true
          description: A RomM /assets/romm/resources image path returned by listRetroRoms
          schema: { type: string }
      responses:
        '200':
          description: A locally proxied RomM cover image
          content:
            image/*:
              schema: { type: string, format: binary }
  /v1/retro/settings:
    get:
      operationId: getRommSettings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: RomM connection status without its credential
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RommSettings'
                  - type: 'null'
    put:
      operationId: updateRommSettings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RommSettingsUpdate'
      responses:
        '200':
          description: Saved RomM connection status without its credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RommSettings'
    delete:
      operationId: clearRommSettings
      security:
        - bearerAuth: []
      responses:
        '204':
          description: RomM connection removed
  /v1/retro/login:
    post:
      operationId: loginRomm
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RommLogin'
      responses:
        '200':
          description: >-
            Signed in once, minted a RomM client token and saved it. The username
            and password are used for that exchange only and never stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RommSettings'
        '400':
          description: The RomM URL is not a loopback http(s) URL
        '502':
          description: RomM refused the sign-in or could not be reached
  /v1/retro/link:
    post:
      operationId: startRommLink
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_url]
              properties:
                base_url: { type: string, format: uri, maxLength: 2048 }
      responses:
        '200':
          description: >-
            A RomM device code and the link a phone opens to approve it. The link
            uses this box's LAN address so a phone on the same network can reach
            RomM.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RommLinkOffer'
        '400':
          description: The RomM URL is not a loopback http(s) URL
        '502':
          description: RomM refused the request or could not be reached
    get:
      operationId: pollRommLink
      security:
        - bearerAuth: []
      responses:
        '200':
          description: >-
            The pending approval's state. Never carries the token; an approved
            device is saved and reported as linked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RommLinkStatus'
        '502':
          description: RomM could not be reached
  /v1/settings:
    get:
      operationId: getUserSettings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
    put:
      operationId: updateUserSettings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettingsUpdate'
      responses:
        '200':
          description: Saved user settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '409':
          description: The supplied settings revision is stale
  /v1/discovery/{source_id}/refresh:
    post:
      operationId: refreshDiscoverySource
      security:
        - bearerAuth: []
      parameters:
        - name: source_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Provider refresh accepted
  /v1/metadata/{provider_id}/refresh:
    post:
      operationId: refreshMetadataProvider
      security:
        - bearerAuth: []
      parameters:
        - name: provider_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Metadata provider refresh accepted
  /v1/launch/{item_id}:
    post:
      operationId: launchItem
      description: >-
        Launches whatever an item id names — the one route a provider-agnostic
        client posts to. A `hearthdeck:`-prefixed id resolves against the
        catalog, where the record's own source decides the launch shape
        (desktop application, Heroic game, Stremio title); a `romm:` id
        launches that ROM through RetroArch; any other id is taken as the
        catalog id itself. The client never parses
        a prefix to pick a route.
      security:
        - bearerAuth: []
      parameters:
        - name: item_id
          in: path
          required: true
          description: The item id a collection item, card, or library entry carries
          schema: { type: string }
        - name: input_profile
          in: query
          description: Controller handling for the launched application
          schema: { type: string, enum: [native, desktop], default: native }
      responses:
        '200':
          description: Launch accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSession'
        '404':
          description: The item id names no launch this daemon knows
        '501':
          description: No RetroArch core is configured for the rom's platform
        '503':
          description: RomM is not configured, or the mapped RetroArch core is not installed
  /v1/sessions/active:
    get:
      operationId: getActiveApplicationSession
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active host application session, if one exists
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApplicationSession'
                  - type: 'null'
  /v1/sessions/active/stop:
    post:
      operationId: stopActiveApplicationSession
      description: >-
        Atomically selects and stops the active bridge session, then closes that
        session's play record before returning. Not retried automatically.
        A timeout does not prove that the application failed to stop.
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Active session stopped and activity completion processed
        '401':
          description: Pairing token missing or invalid
        '404':
          description: No active application session
        '502':
          description: Bridge unavailable or stop rejected
  /v1/sessions/{id}/stop:
    post:
      operationId: stopApplicationSession
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Active application session stop accepted
  /v1/events:
    get:
      operationId: subscribeEvents
      security:
        - bearerAuth: []
      responses:
        '101':
          description: WebSocket upgrade; sends JSON-serialized ServerEvent messages as they occur
  /v1/stremio/link:
    post:
      operationId: startStremioLink
      security:
        - bearerAuth: []
      responses:
        '200':
          description: >-
            A fresh link code, its link, and Stremio's QR image. The user approves
            the code on a device where they are already signed in; no endpoint here
            accepts a password, so there is no password to store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StremioLinkOffer'
        '502':
          description: The Stremio link service could not be reached, or refused the request
    get:
      operationId: pollStremioLink
      security:
        - bearerAuth: []
      responses:
        '200':
          description: >-
            The pending link's state. Never carries the session key: a linked
            account is reported as linked, and the credential stays in the daemon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StremioLinkStatus'
        '502':
          description: The Stremio link service could not be reached
  /v1/stremio/settings:
    get:
      operationId: getStremioSettings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The linked Stremio account without its credential
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/StremioConnection'
                  - type: 'null'
    delete:
      operationId: unlinkStremio
      security:
        - bearerAuth: []
      responses:
        '204':
          description: >-
            Unlinked: the session is gone, and the catalog rows that source owned
            are removed with it, so no rail can outlive the account it came from.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Health:
      type: object
      required: [version, lan_enabled, transport, providers, capabilities]
      properties:
        version: { type: string }
        lan_enabled: { type: boolean }
        transport: { type: string, enum: [http, https] }
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderHealth'
        capabilities:
          $ref: '#/components/schemas/HostCapabilities'
    HostCapabilities:
      type: object
      required: [launch, application_sessions, retro_launch, categorization]
      properties:
        launch: { type: boolean }
        application_sessions: { type: boolean }
        retro_launch: { type: boolean }
        categorization:
          type: boolean
          description: >-
            Whether this daemon can run a scan at all. True on every Linux
            deployment — it is a statement about the build, not a switch — and
            true still means nothing is downloaded or scanned until the user's
            own opt-in says so.
    Diagnostics:
      type: object
      required: [generated_at, services, romm, logs]
      properties:
        generated_at: { type: string, format: date-time }
        services:
          type: array
          items: { $ref: '#/components/schemas/ServiceStatus' }
        romm: { $ref: '#/components/schemas/RommDiagnostic' }
        logs: { $ref: '#/components/schemas/LogTail' }
    ServiceStatus:
      type: object
      required: [id, unit, state, detail]
      properties:
        id: { type: string }
        unit: { type: string }
        state: { type: string, enum: [active, inactive, activating, deactivating, reloading, failed, maintenance, unavailable, unknown] }
        detail: { type: string }
    RommDiagnostic:
      type: object
      required: [configured, status, base_url, console_count, checked_at, error]
      properties:
        configured: { type: boolean }
        status: { type: string, enum: [ready, degraded, not_configured] }
        base_url: { type: [string, 'null'], format: uri }
        console_count: { type: [integer, 'null'], minimum: 0 }
        checked_at: { type: string, format: date-time }
        error: { type: [string, 'null'] }
    LogTail:
      type: object
      required: [available, error, entries]
      properties:
        available: { type: boolean }
        error: { type: [string, 'null'] }
        entries:
          type: array
          maxItems: 30
          items: { $ref: '#/components/schemas/LogEntry' }
    LogEntry:
      type: object
      required: [timestamp, service, level, message]
      properties:
        timestamp: { type: [string, 'null'], format: date-time }
        service: { type: string }
        level: { type: string, enum: [error, warning, info, debug] }
        message: { type: string, maxLength: 600 }
    ApplicationSession:
      type: object
      required: [id, source_id, application_id, state]
      properties:
        id: { type: string }
        source_id: { type: string }
        application_id: { type: string }
        state: { type: string, enum: [running] }
    ProviderHealth:
      type: object
      required: [id, kind, status, record_count, last_attempt_at, last_success_at, last_error]
      properties:
        id: { type: string }
        kind: { type: string, enum: [discovery, metadata] }
        status: { type: string, enum: [starting, refreshing, ready, degraded] }
        record_count: { type: [integer, 'null'], minimum: 0 }
        last_attempt_at: { type: [string, 'null'], format: date-time }
        last_success_at: { type: [string, 'null'], format: date-time }
        last_error: { type: [string, 'null'] }
    PairingRequest:
      type: object
      required: [code, client_name]
      properties:
        code: { type: string, minLength: 12, maxLength: 12 }
        client_name: { type: string, maxLength: 128 }
    PairedClient:
      type: object
      required: [client_id, token]
      properties:
        client_id: { type: string }
        token: { type: string }
    UserSettings:
      type: object
      required: [theme_mode, backdrop_mode, categorization_enabled, revision, updated_at]
      properties:
        theme_mode: { type: string, enum: [system, aurora, ember, indigo, noir] }
        backdrop_mode: { type: string, enum: [solid, edge_wash, quiet_grid] }
        categorization_enabled:
          type: boolean
          description: >-
            The user's opt-in for smart categorization, defaulting to false.
            Set it through the categorization endpoints rather than the settings
            update, which the theme and backdrop clients share.
        revision: { type: integer, minimum: 0 }
        updated_at: { type: string, format: date-time }
    UserSettingsUpdate:
      type: object
      minProperties: 1
      properties:
        theme_mode: { type: string, enum: [system, aurora, ember, indigo, noir] }
        backdrop_mode: { type: string, enum: [solid, edge_wash, quiet_grid] }
        revision: { type: integer, minimum: 0 }
    LibraryItem:
      type: object
      required: [id, source_id, title, kind, metadata, classification]
      properties:
        id: { type: string }
        source_id: { type: string }
        title: { type: string }
        kind: { type: string }
        launch_id: { type: [string, 'null'] }
        icon: { type: [string, 'null'] }
        classification:
          type: object
          required: [section, streaming, form_factor]
          properties:
            section: { type: string, enum: [pc_games, console_games, applications] }
            streaming: { type: boolean }
            form_factor: { type: [string, 'null'], enum: [couch, desktop, null] }
        metadata:
          type: object
          required: [summary, categories, urls, provenance]
          properties:
            summary: { type: string }
            description: { type: [string, 'null'] }
            categories:
              type: array
              items: { type: string }
            developer: { type: [string, 'null'] }
            project_license: { type: [string, 'null'] }
            # Present once the categorization model has judged the application.
            form_factor: { type: string, enum: [couch, desktop] }
            store: { type: [string, 'null'] }
            runner: { type: [string, 'null'] }
            version: { type: [string, 'null'] }
            platform: { type: [string, 'null'] }
            cloud_saves: { type: [boolean, 'null'] }
            install_size_bytes: { type: [integer, 'null'], minimum: 0 }
            requirements:
              type: array
              items:
                type: object
                required: [title, minimum, recommended]
                properties:
                  title: { type: string }
                  minimum: { type: [string, 'null'] }
                  recommended: { type: [string, 'null'] }
            memory_compatibility:
              type: [object, 'null']
              required: [status, system_memory_bytes, minimum_bytes, recommended_bytes]
              properties:
                status: { type: string, enum: [recommended, minimum, below_minimum, below_recommended] }
                system_memory_bytes: { type: integer, minimum: 0 }
                minimum_bytes: { type: [integer, 'null'], minimum: 0 }
                recommended_bytes: { type: [integer, 'null'], minimum: 0 }
            urls:
              type: object
              additionalProperties: { type: string, format: uri-reference }
            screenshots:
              type: array
              items: { type: string, format: uri }
            provenance: { type: string }
    RecentActivity:
      type: object
      required: [id, title, icon, categories, source, metadata, last_launched_at, launch_count]
      properties:
        id: { type: string }
        title: { type: string }
        icon: { type: [string, 'null'] }
        categories:
          type: array
          items: { type: string }
        source: { type: string }
        kind: { type: [string, 'null'] }
        metadata: { type: object }
        last_launched_at: { type: string, format: date-time }
        launch_count: { type: integer, minimum: 1 }
    CollectionItem:
      type: object
      required: [item_id, name]
      properties:
        item_id: { type: string }
        name: { type: string }
        icon: { type: [string, 'null'] }
        background:
          type: [string, 'null']
          description: >-
            Wide artwork for a hero banner, present only on the items of a
            collection that carries art — `stremio:new-arrivals` today. A rail
            card draws `icon` and has none of the three fields below.
        logo: { type: [string, 'null'], description: The title's own wordmark, drawn over `background`. }
        description: { type: [string, 'null'], description: A one-line synopsis of the title. }
        played:
          allOf:
            - $ref: '#/components/schemas/RecentActivity'
          description: >-
            Present on an item a `rule` collection derived from a play, absent on
            a curated one. It is the play record the activity endpoint serves, so
            a client renders and launches the card with the code it already has
            for a play, and needs to know nothing about where the rule's data
            came from.
    Collection:
      type: object
      required: [slug, kind, role, position, owner, items]
      description: >-
        One dashboard rail. `kind` is `membership` (items are curated and
        stored) or `rule` (items are derived on read). `owner` is who may edit
        it: `system` for the built-in rules, `user` for a person's own
        collections, or the id of the feature that created and regenerates it —
        a feature reaches its own rows and nobody else's, so turning it off
        removes its rails and leaves the rest. `role` is `favorite` or
        `play_later` for the collections a screen can toggle by role, and `none`
        otherwise.
      properties:
        slug: { type: string }
        kind: { type: string, enum: [membership, rule] }
        rule: { type: [string, 'null'] }
        role: { type: string, enum: [none, favorite, play_later] }
        position: { type: integer }
        owner:
          type: string
          description: >-
            `system`, `user`, or the feature that owns it. Only a `user`
            collection takes items through the API.
        name:
          type: [string, 'null']
          description: >-
            The label to show when the client does not know the slug: a feature's
            category is one nobody translated when the client shipped.
        items:
          type: array
          items:
            $ref: '#/components/schemas/CollectionItem'
    RetroConsole:
      type: object
      required: [id, name, rom_count]
      properties:
        id: { type: integer }
        name: { type: string }
        display_name: { type: [string, 'null'] }
        rom_count: { type: integer, minimum: 0 }
        slug: { type: [string, 'null'] }
        fs_slug: { type: [string, 'null'] }
        url_logo: { type: [string, 'null'] }
        # Ordered candidate paths (relative to the RomM server) for the
        # platform's bundled console artwork. The client tries each through
        # /v1/retro/assets until one loads, mirroring RomM's own fallback
        # chain. Never empty for a platform read live from RomM.
        artwork_paths:
          type: array
          items: { type: string }
    RetroFacet:
      type: object
      required: [id, label, options]
      properties:
        # Stable id. It is also the query parameter name that narrows
        # /v1/retro/roms by this dimension (`genre`, `region`).
        id: { type: string }
        label: { type: string }
        options:
          type: array
          items: { $ref: '#/components/schemas/RetroFacetOption' }
    RetroFacetOption:
      type: object
      required: [value, label]
      properties:
        # The value passed back in the matching query parameter on
        # /v1/retro/roms.
        value: { type: string }
        # How the value reads to a user, which may differ from `value`.
        label: { type: string }
    RetroGamePage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RetroGame' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
    RetroGame:
      type: object
      required: [id, platform_id, title, screenshot_paths, has_manual, genres, regions, sibling_roms]
      properties:
        id: { type: integer }
        platform_id: { type: integer }
        title: { type: string }
        summary: { type: [string, 'null'] }
        cover_path: { type: [string, 'null'] }
        cover_url: { type: [string, 'null'], format: uri }
        screenshot_paths:
          type: array
          items: { type: string }
        has_manual: { type: boolean }
        genres:
          type: array
          items: { type: string }
        player_count: { type: [string, 'null'] }
        release_year: { type: [integer, 'null'] }
        regions:
          type: array
          items: { type: string }
        # Other files of the same game (regions, revisions, discs) that RomM
        # collapsed into this entry. Empty for a single-file game. The client
        # badges the tile and offers these as "play this version" choices.
        sibling_roms:
          type: array
          items: { $ref: '#/components/schemas/RetroRomVersion' }
        # File-derived label of this entry's own file, present only when
        # sibling_roms is non-empty, so the picker can name the version that
        # "Run" launches.
        version_label: { type: [string, 'null'] }
    RetroRomVersion:
      type: object
      required: [id, title, is_main_sibling]
      properties:
        id: { type: integer }
        title: { type: string }
        is_main_sibling: { type: boolean }
    RetroGameDetails:
      type: object
      required: [
          id,
          platform_id,
          title,
          screenshot_paths,
          genres,
          regions,
          languages,
          tags,
          companies,
          game_modes,
          age_ratings,
          sibling_roms,
          favorite,
          backlogged,
        ]
      properties:
        id: { type: integer }
        platform_id: { type: integer }
        title: { type: string }
        # Platform name RomM resolved, so the screen does not have to look one
        # up in the console list it may not have loaded.
        platform_name: { type: [string, 'null'] }
        summary: { type: [string, 'null'] }
        # The grid tile's cover, kept as the hero's fallback when no large one
        # was downloaded.
        cover_path: { type: [string, 'null'] }
        cover_large_path: { type: [string, 'null'] }
        screenshot_paths:
          type: array
          items: { type: string }
        genres:
          type: array
          items: { type: string }
        player_count: { type: [string, 'null'] }
        release_year: { type: [integer, 'null'] }
        # `YYYY-MM-DD`. RomM's merged metadata reports the first release in
        # milliseconds while its raw IGDB payload uses seconds; the daemon
        # normalises both before formatting.
        release_date: { type: [string, 'null'], format: date }
        regions:
          type: array
          items: { type: string }
        languages:
          type: array
          items: { type: string }
        # Region/file tags such as `NA`, often populated where `regions` is not.
        tags:
          type: array
          items: { type: string }
        companies:
          type: array
          items: { type: string }
        game_modes:
          type: array
          items: { type: string }
        age_ratings:
          type: array
          items: { type: string }
        average_rating: { type: [number, 'null'] }
        file_size_bytes: { type: [integer, 'null'], minimum: 0 }
        sibling_roms:
          type: array
          items: { $ref: '#/components/schemas/RetroRomVersion' }
        version_label: { type: [string, 'null'] }
        favorite: { type: boolean }
        backlogged: { type: boolean }
    RommSettings:
      type: object
      required: [base_url, configured, updated_at]
      properties:
        base_url: { type: string, format: uri }
        configured: { type: boolean }
        updated_at: { type: string, format: date-time }
    RommSettingsUpdate:
      type: object
      required: [base_url, token]
      properties:
        base_url: { type: string, format: uri, maxLength: 2048 }
        token: { type: string, minLength: 1, maxLength: 2048 }
    RommLogin:
      type: object
      required: [base_url, username, password]
      properties:
        base_url: { type: string, format: uri, maxLength: 2048 }
        username: { type: string }
        password: { type: string, format: password }
    RommLinkOffer:
      type: object
      required: [code, link, expires_in_seconds]
      properties:
        code:
          type: string
          description: The code the user confirms in RomM's web UI.
        link: { type: string, format: uri }
        expires_in_seconds: { type: integer }
    RommLinkStatus:
      description: The pending RomM approval's state, tagged by `status`.
      oneOf:
        - type: object
          required: [status]
          properties:
            status: { type: string, enum: [idle, expired, denied] }
        - type: object
          required: [status, code, link, seconds_left]
          properties:
            status: { type: string, enum: [waiting] }
            code: { type: string }
            link: { type: string, format: uri }
            seconds_left: { type: integer }
        - type: object
          required: [status, settings]
          properties:
            status: { type: string, enum: [linked] }
            settings: { $ref: '#/components/schemas/RommSettings' }
    StremioLinkOffer:
      type: object
      required: [code, link, qr, expires_in_seconds]
      properties:
        code:
          type: string
          description: The four characters the user enters in the Stremio app or site.
        link: { type: string, format: uri }
        qr: { type: string, format: uri }
        expires_in_seconds:
          type: integer
          description: >-
            Hearthdeck's own window, not Stremio's: the upstream expiry is
            undocumented, and a live code and a dead one answer identically, so
            only this countdown can end the wait.
    StremioConnection:
      type: object
      description: >-
        The linked account. Deliberately has no field for the session key, and no
        account name: the link flow answers with a key and nothing else.
      required: [linked_at, updated_at]
      properties:
        linked_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    StremioLinkStatus:
      description: >-
        The pending link's state, tagged by `status`. No case carries the session
        key: a linked account is reported as linked, and the credential stays in
        the daemon.
      oneOf:
        - type: object
          required: [status]
          properties:
            status: { type: string, enum: [idle] }
        - type: object
          required: [status]
          properties:
            status: { type: string, enum: [expired] }
        - type: object
          required: [status, code, link, qr, seconds_left]
          properties:
            status: { type: string, enum: [waiting] }
            code: { type: string }
            link: { type: string, format: uri }
            qr: { type: string, format: uri }
            seconds_left: { type: integer }
        - type: object
          required: [status, connection]
          properties:
            status: { type: string, enum: [linked] }
            connection: { $ref: '#/components/schemas/StremioConnection' }
    CategorizationResponse:
      type: object
      required: [enabled, status, report]
      properties:
        enabled:
          type: boolean
          description: >-
            The user's opt-in. Everything heavy waits on it, and a client only
            applies a report's tabs while it is true.
        status: { $ref: '#/components/schemas/CategorizationStatus' }
        report:
          oneOf:
            - $ref: '#/components/schemas/ScanReport'
            - type: 'null'
    CategorizationStatus:
      type: object
      required: [running, phase, completed, total, model]
      properties:
        running: { type: boolean }
        phase: { $ref: '#/components/schemas/CategorizationPhase' }
        completed:
          type: integer
          minimum: 0
          description: Applications decided so far, while `phase` is `scanning`.
        total:
          type: integer
          minimum: 0
          description: Applications to decide, while `phase` is `scanning`.
        model: { $ref: '#/components/schemas/ModelStatus' }
        last_error: { type: [string, 'null'] }
        last_completed_at: { type: [string, 'null'], format: date-time }
    CategorizationPhase:
      type: string
      enum: [idle, downloading, loading, scanning]
      description: >-
        `downloading` is the daemon's reading of the load phase when no
        checkpoint was on disk: fetching one happens inside the engine load.
    ModelStatus:
      oneOf:
        - type: object
          required: [state]
          properties:
            state: { type: string, enum: [absent] }
        - type: object
          required: [state, bytes, path]
          properties:
            state: { type: string, enum: [downloaded] }
            bytes: { type: integer, minimum: 0 }
            path: { type: string }
        - type: object
          required: [state, path]
          properties:
            state: { type: string, enum: [external] }
            path: { type: string }
      description: >-
        `external` is a checkpoint the deployment pointed at directly, which is
        how an offline install sideloads one. Hearthdeck never deletes it.
    ScanReport:
      type: object
      required: [generated_at, categorizer, app_count, assignments, failures, categories, unclassified]
      properties:
        generated_at: { type: string, format: date-time }
        categorizer: { type: string }
        researcher: { type: [string, 'null'] }
        app_count: { type: integer, minimum: 0 }
        assignments:
          type: array
          items: { $ref: '#/components/schemas/AppCategorization' }
        failures:
          type: array
          items: { $ref: '#/components/schemas/ScanFailure' }
        categories:
          type: array
          items: { $ref: '#/components/schemas/CategoryProposal' }
        unclassified:
          type: array
          items: { $ref: '#/components/schemas/UnclassifiedApp' }
    AppCategorization:
      type: object
      required: [app_id, title, section, section_confidence, categories, needs_category, traits, provenance]
      properties:
        app_id: { type: string }
        title: { type: string }
        section: { type: string, enum: [pc_games, console_games, applications] }
        section_confidence: { type: number, minimum: 0, maximum: 1 }
        categories:
          type: array
          items: { $ref: '#/components/schemas/CategoryMatch' }
        needs_category:
          type: boolean
          description: >-
            The app belongs in Applications but no candidate category fit, so
            the taxonomy is missing an entry for it.
        traits: { $ref: '#/components/schemas/AppTraits' }
        provenance: { type: string, enum: [laya, heuristic] }
        rationale: { type: [string, 'null'] }
    AppTraits:
      type: object
      required: [game, watch_service, emulator]
      properties:
        game: { type: [number, 'null'], minimum: 0, maximum: 1 }
        watch_service: { type: [number, 'null'], minimum: 0, maximum: 1 }
        emulator: { type: [number, 'null'], minimum: 0, maximum: 1 }
    CategoryMatch:
      type: object
      required: [slug, name, confidence]
      properties:
        slug: { type: string }
        name: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
    CategoryProposal:
      type: object
      required: [slug, name, section, app_ids, mean_confidence, recommended]
      properties:
        slug: { type: string }
        name: { type: string }
        section: { type: string, enum: [pc_games, console_games, applications] }
        app_ids:
          type: array
          items: { type: string }
        mean_confidence: { type: number, minimum: 0, maximum: 1 }
        recommended:
          type: boolean
          description: The category cleared the membership and confidence bars, so it is worth a tab.
    ScanFailure:
      type: object
      required: [app_id, error]
      properties:
        app_id: { type: string }
        error: { type: string }
    UnclassifiedApp:
      type: object
      required: [app_id, title]
      properties:
        app_id: { type: string }
        title: { type: string }
