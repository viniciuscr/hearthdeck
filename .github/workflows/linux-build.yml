name: Arch Linux Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    container: ghcr.io/archlinux/archlinux:base-devel

    steps:
      - uses: actions/checkout@v6

      - name: Install Arch build dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman --sync --refresh --sysupgrade --noconfirm
          pacman --sync --noconfirm clang cmake curl git gtk3 jq just ninja pkgconf sqlite unzip xz zsh

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy,rustfmt

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Configure package builder
        run: |
          flutter_root=$(dirname "$(dirname "$(command -v flutter)")")
          useradd --create-home builder
          cp -a "$HOME/.cargo" "$HOME/.rustup" /home/builder/
          chown -R builder:builder "$flutter_root" /home/builder "$GITHUB_WORKSPACE"

      - name: Build pacman package
        run: |
          flutter_bin=$(dirname "$(command -v flutter)")
          package_version="1.0.0.r${GITHUB_RUN_NUMBER}"
          su --login builder --command "cd '$GITHUB_WORKSPACE' && HEARTHDECK_PKGVER='$package_version' HEARTHDECK_PKGREL=1 PATH='$flutter_bin:/home/builder/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/bin' just ci-package-arch"

      - name: Build pacman repository database
        run: |
          repository="$GITHUB_WORKSPACE/repository/arch/x86_64"
          mkdir -p "$repository"
          package_path=$(printf '%s\n' packaging/arch/hearthdeck-*.pkg.tar.zst)
          test -f "$package_path"
          cp "$package_path" "$repository/"
          package_path="$repository/$(basename "$package_path")"
          command -v repo-add
          repo-add --nocolor "$repository/hearthdeck.db.tar.gz" "$package_path"
          ln -sf hearthdeck.db.tar.gz "$repository/hearthdeck.db"
          test -s "$repository/hearthdeck.db.tar.gz"

      - name: Archive pacman package
        uses: actions/upload-artifact@v4
        with:
          name: hearthdeck-pacman-x86_64
          path: packaging/arch/hearthdeck-*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

      - name: Archive pacman repository
        uses: actions/upload-artifact@v4
        with:
          name: hearthdeck-pacman-repository
          path: repository
          if-no-files-found: error
          retention-days: 7

  publish-repository:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download pacman repository
        uses: actions/download-artifact@v5
        with:
          name: hearthdeck-pacman-repository
          path: repository

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: repository

      - name: Deploy GitHub Pages repository
        id: deployment
        uses: actions/deploy-pages@v4
