name: Arch Linux Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    container: ghcr.io/archlinux/archlinux:base-devel

    steps:
      - uses: actions/checkout@v6

      - name: Install Arch build dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman --sync --refresh --sysupgrade --noconfirm
          pacman --sync --noconfirm clang cmake curl git gtk3 jq just ninja pacman-contrib pkgconf sqlite unzip xz zsh

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy,rustfmt

      - name: Configure package builder
        run: |
          useradd --create-home builder
          cp -a "$HOME/.cargo" "$HOME/.rustup" /home/builder/
          chown -R builder:builder /home/builder "$GITHUB_WORKSPACE"

      - name: Restore Rust release cache
        id: rust-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            /home/builder/.cargo/git
            /home/builder/.cargo/registry
            services/target/release
          key: arch-package-rust-v2-${{ runner.arch }}-rust-1.97.1-${{ hashFiles('services/Cargo.lock') }}
          restore-keys: |
            arch-package-rust-v2-${{ runner.arch }}-rust-1.97.1-

      - name: Make restored cache writable
        run: |
          chown -R builder:builder /home/builder/.cargo "$GITHUB_WORKSPACE/services/target" 2>/dev/null || true

      - name: Build pacman package
        run: |
          package_version="1.0.0.r${GITHUB_RUN_NUMBER}"
          su --login builder --command "cd '$GITHUB_WORKSPACE' && HEARTHDECK_PKGVER='$package_version' HEARTHDECK_PKGREL=1 PATH='/home/builder/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/bin' just ci-package-arch"

      - name: Archive package build logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hearthdeck-package-build-logs
          path: packaging/arch/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Build pacman repository database
        run: |
          repository="$GITHUB_WORKSPACE/repository/arch/x86_64"
          mkdir -p "$repository"
          package_path=$(printf '%s\n' packaging/arch/hearthdeck-*.pkg.tar.zst)
          test -f "$package_path"
          cp "$package_path" "$repository/"
          package_path="$repository/$(basename "$package_path")"
          command -v repo-add
          repo-add --nocolor "$repository/hearthdeck.db.tar.gz" "$package_path"
          ln -sf hearthdeck.db.tar.gz "$repository/hearthdeck.db"
          test -s "$repository/hearthdeck.db.tar.gz"

      - name: Save Rust release cache
        if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            /home/builder/.cargo/git
            /home/builder/.cargo/registry
            services/target/release
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

      - name: Archive pacman package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hearthdeck-pacman-x86_64
          path: packaging/arch/hearthdeck-*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

      - name: Archive pacman repository
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hearthdeck-pacman-repository
          path: repository
          if-no-files-found: error
          retention-days: 7

  publish-repository:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download pacman repository
        uses: actions/download-artifact@v8.0.1
        with:
          name: hearthdeck-pacman-repository
          path: repository

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: repository

      - name: Deploy GitHub Pages repository
        id: deployment
        uses: actions/deploy-pages@v5
