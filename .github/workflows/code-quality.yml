name: Code Quality & CI Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-rust:
    name: Rust Code Quality
    runs-on: ubuntu-latest
    container: ghcr.io/archlinux/archlinux:base-devel
    env:
      CARGO_INCREMENTAL: 0
    strategy:
      fail-fast: true
    
    steps:
      - uses: actions/checkout@v6

      - name: Install Arch dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman --sync --refresh --sysupgrade --noconfirm
          pacman --sync --noconfirm clang cmake curl git gtk3 jq just ninja pacman-contrib pkgconf sqlite unzip xz
          pacman --sync --noconfirm wayland wayland-protocols libxkbcommon

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy,rustfmt

      - name: Restore Rust build cache
        id: cache-restore
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            services/target
          key: check-rust-v2-${{ runner.arch }}-rust-1.97.1-${{ hashFiles('services/Cargo.lock') }}
          restore-keys: |
            check-rust-v2-${{ runner.arch }}-rust-1.97.1-

      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path services/Cargo.toml --all -- --check
        continue-on-error: false

      - name: Check Rust (debug mode)
        run: |
          cargo check --manifest-path services/Cargo.toml --workspace
        continue-on-error: false

      - name: Run Rust tests
        run: |
          cargo test --manifest-path services/Cargo.toml --workspace
        continue-on-error: false

      - name: Run Clippy (release mode with strict linting)
        run: |
          cargo clippy --manifest-path services/Cargo.toml --workspace --all-targets --release -- -D warnings
        continue-on-error: false

      - name: Save Rust build cache
        if: github.ref == 'refs/heads/main' && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            services/target
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

  validate-ci-readiness:
    name: CI Readiness Check
    needs: check-rust
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - uses: actions/checkout@v6

      - name: Check if all quality gates passed
        run: |
          if [ "${{ needs.check-rust.result }}" != "success" ]; then
            echo "❌ Rust code quality checks failed"
            exit 1
          fi
          echo "✅ All code quality gates passed"
